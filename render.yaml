services:
  - type: web
    name: aptirecall-web
    runtime: docker
    plan: free
    branch: main
    rootDir: .
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health/
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: backend.settings.production

      - key: DJANGO_SECRET_KEY
        generateValue: true

      - key: DEBUG
        value: "False"

      - key: ALLOWED_HOSTS
        value: aptirecall-web.onrender.com

      - key: CORS_ALLOWED_ORIGINS
        value: https://aptirecall-frontend.onrender.com

      - key: CSRF_TRUSTED_ORIGINS
        value: https://aptirecall-frontend.onrender.com

      - key: SECURE_SSL_REDIRECT
        value: "True"

      - key: DATABASE_URL
        fromDatabase:
          name: aptirecall-db
          property: connectionString

  - type: web
    name: aptirecall-frontend
    runtime: static
    branch: main
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://aptirecall-web.onrender.com/api

databases:
  - name: aptirecall-db
    plan: free
