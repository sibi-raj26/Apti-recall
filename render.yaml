
services:
  - type: web
    name: aptirecall-web
    runtime: docker
    plan: starter
    branch: main
    rootDir: .
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health/
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: backend.settings.production

      - key: DJANGO_SECRET_KEY
        generateValue: true

      - key: DEBUG
        value: "False"

      - key: ALLOWED_HOSTS
        value: aptirecall-web.onrender.com

      - key: CORS_ALLOWED_ORIGINS
        value: https://aptirecall-frontend.onrender.com

      - key: CSRF_TRUSTED_ORIGINS
        value: https://aptirecall-frontend.onrender.com

      - key: SECURE_SSL_REDIRECT
        value: "True"

      - key: DATABASE_URL
        fromDatabase:
          name: aptirecall-db
          property: connectionString

      - key: CELERY_BROKER_URL
        fromService:
          type: keyvalue
          name: aptirecall-redis
          property: connectionString

      - key: CELERY_RESULT_BACKEND
        fromService:
          type: keyvalue
          name: aptirecall-redis
          property: connectionString

  - type: worker
    name: aptirecall-celery
    runtime: docker
    plan: starter
    branch: main
    rootDir: .
    dockerfilePath: ./Dockerfile
    entrypoint: /app/celery-entrypoint.sh
    command: celery -A backend.celery worker --loglevel=info
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: backend.settings.production

      - key: DJANGO_SECRET_KEY
        fromService:
          type: web
          name: aptirecall-web
          envVarKey: DJANGO_SECRET_KEY

      - key: DEBUG
        value: "False"

      - key: ALLOWED_HOSTS
        value: aptirecall-web.onrender.com

      - key: DATABASE_URL
        fromDatabase:
          name: aptirecall-db
          property: connectionString

      - key: CELERY_BROKER_URL
        fromService:
          type: keyvalue
          name: aptirecall-redis
          property: connectionString

      - key: CELERY_RESULT_BACKEND
        fromService:
          type: keyvalue
          name: aptirecall-redis
          property: connectionString

  - type: keyvalue
    name: aptirecall-redis
    plan: starter
    maxmemoryPolicy: noeviction
    ipAllowList:
      - source: 0.0.0.0/0
        description: Allow connections

databases:
  - name: aptirecall-db
    plan: starter
